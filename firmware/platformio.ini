; 机器人主控固件 - ESP32-S3 N16R8
;
; ⚠️ 串口说明（重要）
;   这块 S3 有两个 USB 口：
;     - 标 "UART" / "COM"  → CH343 芯片 → 独立串口，功耗低、能自动复位
;     - 标 "USB"           → 原生 USB-Serial/JTAG，WiFi 发射时容易掉线
;
;   现在用的是 UART 口（COM8，CH343）。
;   所以 ARDUINO_USB_CDC_ON_BOOT 必须是 0，
;   让 Serial 走 UART0（GPIO43/44），才能在这个口看到输出。
;
;   如果换成插原生 USB 口（出现 COM10），要把这个改成 1。

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 的 Flash 是 16MB，板型定义默认给 8MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; N16R8 = 16MB QIO Flash + 8MB OPI (Octal) PSRAM
; 不写这行会报 PSRAM ID read error，可用堆只有 320KB
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11
